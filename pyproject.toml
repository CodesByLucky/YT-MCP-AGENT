[project]
name = "yt-mcp-agent"
version = "0.2.0"
description = "YouTube video agent using MCP and OpenRouter for transcript extraction and content generation"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Lucky Samant" },
]
dependencies = [
    "mcp[cli]>=1.15.0,<2",  # mcp 2.x renamed FastMCP
    "openai>=1.109.1",
    "openai-agents>=0.3.3",
    "python-dotenv>=1.1.1",
    "youtube-transcript-api>=1.2.2,<2",
]
